<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Expense Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/login.css">
</head>

<body>
    <main class="login-wrapper">
        <section class="login-box">
            <header class="header">
                <h1>₹ Expense Tracker</h1>
                <p>Sign in to manage your personal finances.</p>
            </header>

            <form id="authForm" class="simple-form">
                <div class="input-field" id="usernameField" hidden>
                    <label for="username">Name</label>
                    <input type="text" id="username" autocomplete="name" maxlength="100">
                </div>

                <div class="input-field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" autocomplete="email" placeholder="you@example.com" required>
                </div>

                <div class="input-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" autocomplete="current-password"
                        placeholder="At least 8 characters" minlength="8" required>
                </div>

                <p class="auth-message" id="authMessage" role="status" aria-live="polite"></p>
                <button type="submit" class="login-btn" id="authSubmit">Sign in</button>
            </form>

            <footer class="footer-note">
                <p><span id="authPrompt">New here?</span>
                    <button class="link-button" id="authModeToggle" type="button">Create an account</button>
                </p>
            </footer>
        </section>
    </main>

    <script src="/api.js"></script>
    <script>
        const authForm = document.getElementById('authForm');
        const usernameField = document.getElementById('usernameField');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const message = document.getElementById('authMessage');
        const submitButton = document.getElementById('authSubmit');
        const toggleButton = document.getElementById('authModeToggle');
        let isSignup = false;

        async function redirectIfSignedIn() {
            try {
                await apiRequest('/auth/me', { redirectOnUnauthorized: false });
                window.location.replace('/');
            } catch (error) {
                if (error.status !== 401) message.textContent = error.message;
            }
        }

        toggleButton.addEventListener('click', () => {
            isSignup = !isSignup;
            usernameField.hidden = !isSignup;
            usernameInput.required = isSignup;
            passwordInput.autocomplete = isSignup ? 'new-password' : 'current-password';
            submitButton.textContent = isSignup ? 'Create account' : 'Sign in';
            document.getElementById('authPrompt').textContent = isSignup ? 'Already registered?' : 'New here?';
            toggleButton.textContent = isSignup ? 'Sign in instead' : 'Create an account';
            message.textContent = '';
        });

        authForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            message.textContent = '';
            submitButton.disabled = true;
            const originalLabel = isSignup ? 'Create account' : 'Sign in';
            submitButton.textContent = isSignup ? 'Creating account...' : 'Signing in...';

            try {
                await apiRequest(isSignup ? '/signup' : '/login', {
                    method: 'POST',
                    body: JSON.stringify({
                        username: usernameInput.value.trim(),
                        email: document.getElementById('email').value.trim(),
                        password: passwordInput.value
                    }),
                    redirectOnUnauthorized: false
                });
                window.location.replace('/');
            } catch (error) {
                message.textContent = error.message;
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = originalLabel;
            }
        });

        redirectIfSignedIn();
    </script>
</body>

</html>
